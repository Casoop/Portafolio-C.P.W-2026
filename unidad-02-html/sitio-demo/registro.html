<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sitio Demo | Codificación de páginas web</title>
    <!--Nuestros metadatos-->
    <meta name="description" content="Formulario del registro del sitio-demo" />
    <meta name="keywords" content="registro, formulario, sitio-demo" />
    <meta name="author" content="Elías-GC" />
    <title>Formulario | Registro</title>
  </head>

  <body>
    <header>
      <!--Header: Cabecera de la página y generalmente se repetite en todo el sitio-->
      <h1>Codificación de páginas web</h1>
      <p>Sitio de demostración del módulo</p>

      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="articulo.html">Artículos</a></li>
          <li><a href="horario.html">Horario</a></li>
          <li><a href="registro.html"></a>Registro</li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Formulario de matrícula</h2>
      <form action="#" method="post">
        <!--Form: contenedor del fomulario. action: donde se envia el formulario. method: es el metodo de envio. post: envio de datos por el cuerpo de la solicitud-->
        <fieldset>
          <!--Contenedor de los elementos del formulario-->
          <legend>Información personal</legend>
          <!--Legend: título del fieldset-->

          <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required /><br /><br />
          </p>

          <p>
            <label for="correo">Correo electronico:</label>
            <input
              type="email"
              id="correo"
              name="correo"
              required
            /><br /><br />
          </p>
          <button type="submit">Enviar matrícula</button>
        </fieldset>
      </form>
      <fieldset>
        <legend>Detalles de matrícula</legend>
        <p>
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono" required pattern="[0-9]{8}" title="Ingrese un número de teléfono valido de 8 digitos"/><br /><br />
        </p>
        <p>
          <label for="fecha">Fecha de inicio:</label>
          <input type="date" id="fecha" name="fecha" /><br /><br />
        </p>

        <p>
          <label for="edad">Edad:</label>
          <input type="number" id="edad" name="edad" min="15" max="120" step="1"/><br /><br />
        </p>
      </fieldset>

      <fieldset>
        <legend>Modalidad</legend>
        <input
          type="radio"
          id="Presencial"
          name="Modalidad"
          value="Presencial"
        />
        <label for="Presencial">Presencial</label><br />
        <input type="radio" id="virtual" name="Modalidad" value="virtual" />
        <label for="virtual">Virtual</label><br />
        <input type="radio" id="mixta" name="Modalidad" value="mixta" />
        <label for="mixta">mixta</label><br /><br />
      </fieldset>

      <p><label for="horaio">Horario preferido</label><br />
      <select id="horaio" name="horaio">
        <option value="mañana">Mañana</option>
        <option value="tarde">Tarde</option>
        <option value="noche">Noche</option>
      </select><br><br>
      </p>

      <p>
        <label for="comentarios">Comentarios</label><br>
        <textarea name="comentarios" id="comentarios" rows="4" cols="50" maxlength="200"></textarea><br><br>
      </p>
      
    </main>

    <footer>
      <!--Footer: Pie, créditos, contacto, derechos-->
      <p>
        ® 2026 INA. Programa Desarrollo de Páginas web. Todos los derechos
        reservados.
      </p>
    </footer>
  </body>
</html>
